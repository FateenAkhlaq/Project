<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Styling in CSS</title>

    <!-- Internal CSS -->
    <style>
        h2 {
            color: mediumpurple;
        }
    
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="cssproject.css">
</head>

<body>
    <hr>

    <!-- Inline CSS -->
    <h1 style="color: rgb(154, 66, 7);">Example of Inline CSS</h1>

    <!-- Internal CSS -->
    <h2>Internal CSS Example</h2>

    <!-- External CSS -->
    <h3>Example of Externel CSS</h3>
    <hr>

    <!-- Class & ID Selector -->
    <h2 class="myclass">Example Of Class Selector</h2>
    <h2 id="myid">ID Selector Example</h2>

    <hr>

    <!-- Group Selector -->
    <h5>Group Selector Example</h5>
    <p>Another Example Of Group Selector.</p>
    <hr>
</body>

</html>

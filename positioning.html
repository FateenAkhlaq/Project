<!DOCTYPE html>
<html lang="en">
<head>
   <style>
    div {
        right: 30px;
        border:3px solid #73AD21;
    }
    div.absolute {
        position: absolute;
        left: 50px;
        border:3px solid blueviolet;
    }
    div.relative {
        position: relative;
        left: 100px; 
    border: 3px solid #73AD21;
    }
    div.fixed {
        position: fixed;
        top: 0; 
        right: 20px;
        width: 300px;
        border: 3px solid salmon;
    }
    div.sticky {
        position: sticky;
        top:  1px; 
        left: 20px;
        width: 300px;
        border: 3px solid #22A22231; 
    }
   </style>
</head>
<body>
    <!--change the position to show the difference
    static 
    relative
    fixed
    sticky
    absolute
    -->
    <h2>Positioning</h2>
    <div>
        Div with no position property
    </div>
    <div class="sticky">
        Div with sticky position property
    </div>
    <div class="fixed">
        Div with fixed position property
    </div>
    <div class="relative">
        This has div element position: relative;
    </div>
    <div class="absolute">
        Absolute div class
    </div>

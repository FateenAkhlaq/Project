<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Personal Details Form</h1>
    <form>
        <label><b>Name</b></label></br>
        <input type="text" id="name"></br><br>
        <label><b>Email ID</b></label><br>
        <input type="text" id="email"></br><br>
        <label><b>Contact Number (this will be hidden)</b></label><br>
        <input type="password" id="contact"><br><br>
        <label><b>Gender</b></label><br>
        <input type="radio" id="female" name="gender" value="Female">Female<br>
        <input type="radio" id="male" name="gender" value="Male">Male<br><br>
        <label>Favourite City</label><br>
        <input type="checkbox" id="city" value="Karachi">Karachi<br>
        <input type="checkbox" id="city" value="Islamabad">Islamabad<br>
        <input type="checkbox" id="city" value="Hyderabad">Hyderabad<br>
        <input type="checkbox" id="city" value="Multan">Multan<br>
        <input type="submit"><br>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling In CSS(HTML)</title>
    <!-- Internal CSS -->
     <style>   
        h2 {   
            color:mediumpurple;
        }
     </style>
     <!--External CSS-->
     <link rel="stylesheet" href="style.css">
</head>
<body>
     <hr>
     <!--Inline CSS-->
     <h1 style="color: aquamarine;">Inline CSS Example</h1>
     <!--Internal CSS-->
     <h2>Internal CSS Example</h2>
     <!--External CSS-->
     <h3>External CSS Example</h3>
     <hr>
     <!--Class and Id Selector Example-->
     <h2 class="myclass">Class Selector Example</h2>  
     <h2 id="myid">Id Selector Example</h2>
     <h2 class="myclass">Class Selector Example</h2>
     <hr>

     <!--Group Selector Example-->
     <h5>Group Selector Example</h5>
     <p>Group Selector Example.</p>
     <hr>
</body>
</html>

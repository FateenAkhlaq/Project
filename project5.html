<!DOCTYPE html>
<html>

<head>
    <title>Registration Form</title>
</head>

<style>
    h1 {
        font-family: Georgia, sans-serif;
    }
    form {
        font-family: G, sans-serif;
    }
</style>

<body bgcolor="mediumpurple">

    <h1>Student Registration Form</h1>

    <form>
        <legend>

            <label><b>Full Name:</label>
            <input type="text" name="fullname"><br><br>

            <label>Email:</label>
            <input type="email" name="email"><br><br>

            <label>Phone Number:</label>
            <input type="tel" name="phone"><br><br>

            <label>Age:</label>
            <input type="number" name="age"><br><br>

            <label><b>Gender:</b></label><br>
            <input type="radio" name="gender" value="male"> Male <br>
            <input type="radio" name="gender" value="female"> Female <br>
            <input type="radio" name="gender" value="other"> Other <br><br>

            <label><b>Favourite Footballer:</b></label><br>
            <input type="checkbox" name="footballer" value="ronaldo"> Cristiano Ronaldo <br>
            <input type="checkbox" name="footballer" value="messi"> Lionel Messi <br><br>

        </legend>
        </form>
        </body>
        </html>
